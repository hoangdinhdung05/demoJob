<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Application Approved</title>
</head>
<body>
<p>Hi <span th:text="${user.fullName}">Candidate</span>,</p>

<p>
    Congratulations! Your application for the job
    <strong th:text="${job.name}">Job</strong> at
    <strong th:text="${job.company.name}">Company</strong> has been approved.
</p>

<p>Our HR team will contact you shortly for the next steps.</p>

<br/>
<p>Best regards,<br/>The HR Team</p>
</body>
</html>
