<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>New Resume Submitted</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .email-container {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
        }

        .header h1 {
            color: #4f46e5;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .greeting {
            font-size: 16px;
            margin-bottom: 20px;
            color: #374151;
        }

        .main-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .job-title {
            font-weight: 700;
            font-size: 18px;
            margin: 8px 0;
        }

        .candidate-name {
            font-weight: 600;
            color: #fbbf24;
        }

        .details-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            margin: 20px 0;
        }

        .details-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .detail-item {
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-label {
            font-weight: 500;
            color: #6b7280;
            min-width: 80px;
        }

        .detail-value {
            color: #374151;
            flex: 1;
        }

        .cv-link {
            display: inline-block;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .cv-link:hover {
            background: #059669;
            text-decoration: none;
            color: white;
        }

        .action-section {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #fffbeb;
            border-radius: 8px;
            border: 1px solid #fbbf24;
        }

        .action-text {
            color: #92400e;
            font-weight: 500;
            margin: 0;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }

        .icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <h1>🎯 New Job Application</h1>
    </div>

    <div class="greeting">
        Xin chào <strong th:text="${hrName}">HR</strong>,
    </div>

    <div class="main-message">
        <div>Ứng viên <span class="candidate-name" th:text="${candidateName}">Candidate</span> vừa ứng tuyển vào vị trí</div>
        <div class="job-title" th:text="${jobName}">Job Position</div>
    </div>

    <div class="details-section">
        <div class="details-title">📋 Thông tin chi tiết:</div>

        <div class="detail-item">
            <span class="detail-label">📧 Email:</span>
            <span class="detail-value" th:text="${candidateEmail}">candidate@example.com</span>
        </div>

        <div class="detail-item">
            <span class="detail-label">📄 CV:</span>
            <div class="detail-value">
                <a th:href="${resumeUrl}" class="cv-link" target="_blank">
                    📥 Xem CV của ứng viên
                </a>
            </div>
        </div>

        <div class="detail-item">
            <span class="detail-label">📤 Từ:</span>
            <span class="detail-value" th:text="${fromEmail}">system@company.com</span>
        </div>
    </div>

    <div class="action-section">
        <p class="action-text">⚡ Vui lòng đăng nhập hệ thống để xem xét hồ sơ ứng viên</p>
    </div>

    <div class="footer">
        <p>Email tự động từ hệ thống tuyển dụng</p>
    </div>
</div>
</body>
</html>
