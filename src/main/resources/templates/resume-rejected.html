<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Application Rejected</title>
</head>
<body>
<p>Hi <span th:text="${user.email}">Candidate</span>,</p>

<p>
    We regret to inform you that your application for the job
    <strong th:text="${job.name}">Job</strong> at
    <strong th:text="${job.company.name}">Company</strong> has been rejected.
</p>

<p th:if="${reason != null}">
    Reason: <span th:text="${reason}">Reason</span>
</p>

<br/>
<p>Thank you for your interest. We wish you success in your future career.</p>
</body>
</html>
